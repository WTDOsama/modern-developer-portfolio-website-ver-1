<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Preview of a React analytics dashboard with charts and statistic cards">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgd)"/>
  <circle cx="660" cy="120" r="90" fill="#818cf8" opacity="0.18"/>

  <rect x="70" y="80" width="660" height="440" rx="26" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>

  <rect x="102" y="114" width="170" height="16" rx="8" fill="#e0e7ff" opacity="0.9"/>
  <rect x="102" y="142" width="110" height="10" rx="5" fill="#a5b4fc" opacity="0.7"/>

  <g>
    <rect x="102" y="180" width="180" height="86" rx="16" fill="#ffffff" opacity="0.12"/>
    <rect x="518" y="180" width="180" height="86" rx="16" fill="#ffffff" opacity="0.12"/>
  </g>
  <g fill="#ffffff">
    <rect x="124" y="202" width="60" height="11" rx="5" opacity="0.55"/>
    <rect x="540" y="202" width="60" height="11" rx="5" opacity="0.55"/>
  </g>
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="30" font-weight="800">
    <text x="124" y="248">4.8k</text>
    <text x="540" y="248">92%</text>
  </g>

  <rect x="102" y="292" width="596" height="196" rx="18" fill="#ffffff" opacity="0.10"/>
  <g fill="url(#bar)">
    <rect x="140" y="392" width="42" height="72" rx="10"/>
    <rect x="204" y="356" width="42" height="108" rx="10"/>
    <rect x="268" y="410" width="42" height="54" rx="10"/>
    <rect x="332" y="336" width="42" height="128" rx="10"/>
    <rect x="396" y="378" width="42" height="86" rx="10"/>
    <rect x="460" y="348" width="42" height="116" rx="10"/>
    <rect x="524" y="402" width="42" height="62" rx="10"/>
    <rect x="588" y="366" width="42" height="98" rx="10"/>
  </g>
  <rect x="140" y="312" width="120" height="11" rx="5" fill="#ffffff" opacity="0.5"/>
</svg>
